<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="52%" stop-color="#0D121F" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="29%" r="64%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="innerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <clipPath id="circleMask">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleMask)">
    <!-- Layer 1a: Full-bleed Deep Obsidian Slate Vertical Gradient -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Layer 1b: Top-center Radial Electric Indigo Ambient Glow -->
    <rect width="512" height="512" fill="url(#topGlow)" />

    <!-- Layer 1c: Subtle Architectural Micro-Grid -->
    <g stroke="#BDC2FF" stroke-opacity="0.06" stroke-width="2">
      <line x1="64" y1="0" x2="64" y2="512" />
      <line x1="128" y1="0" x2="128" y2="512" />
      <line x1="192" y1="0" x2="192" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="320" y1="0" x2="320" y2="512" />
      <line x1="384" y1="0" x2="384" y2="512" />
      <line x1="448" y1="0" x2="448" y2="512" />
      <line x1="0" y1="64" x2="512" y2="64" />
      <line x1="0" y1="128" x2="512" y2="128" />
      <line x1="0" y1="192" x2="512" y2="192" />
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="0" y1="320" x2="512" y2="320" />
      <line x1="0" y1="384" x2="512" y2="384" />
      <line x1="0" y1="448" x2="512" y2="448" />
    </g>

    <!-- Layer 1d: Concentric Safe-Zone Circular Halo + Rim -->
    <circle cx="256" cy="256" r="198" fill="url(#innerHalo)" stroke="#BDC2FF" stroke-opacity="0.18" stroke-width="3.5" />
    <circle cx="256" cy="256" r="252" fill="none" stroke="#BDC2FF" stroke-opacity="0.22" stroke-width="6" />

    <!-- Layer 2: Stitch Round-Safe Developer Emblem (< / > + syntax dots) -->
    <path d="M 171 166 L 107 238 L 171 310"
          fill="none" stroke="#BDC2FF" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="295" y1="128" x2="217" y2="348"
          stroke="#818CF8" stroke-width="36" stroke-linecap="round" />
    <path d="M 341 166 L 405 238 L 341 310"
          fill="none" stroke="#FFFFFF" stroke-width="33" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="220" cy="388" r="14" fill="#818CF8" />
    <circle cx="256" cy="388" r="14" fill="#BDC2FF" />
    <circle cx="292" cy="388" r="14" fill="#FFFFFF" />
  </g>
</svg>
